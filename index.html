<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memo">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>Memo PWA</title>
</head>
<body>
  <h2>Home</h2>
  <p>All assets use relative paths for reliable deployment.</p>
  <ul>
    <li><a href="./notes.html">Notes</a></li>
    <li><a href="./tasks.html">Tasks</a></li>
    <li><a href="./about.html">About</a></li>
  </ul>

  <div id="install-container" class="install-container hidden" role="dialog" aria-live="polite">
    <button id="install-btn" class="install-action">Add to Home screen</button>
    <span id="install-text">Install Memo to your home screen</span>
  </div>

  <script>
    let deferredInstallPrompt = null;
    const installContainer = document.getElementById("install-container");
    const installBtn = document.getElementById("install-btn");
    const installText = document.getElementById("install-text");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installText.textContent = "Add Memo to your home screen";
      installContainer.classList.remove("hidden");
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) {
        installText.textContent = "Use your browser menu to Add to Home screen.";
        return;
      }

      deferredInstallPrompt.prompt();
      const choiceResult = await deferredInstallPrompt.userChoice;
      console.log("Install prompt result:", choiceResult.outcome);

      if (choiceResult.outcome === "accepted") {
        installText.textContent = "Installed. Open it from your home screen.";
      } else {
        installText.textContent = "Install canceled. You can try again from the button.";
      }

      deferredInstallPrompt = null;
      installContainer.classList.add("hidden");
    });

    window.addEventListener("appinstalled", () => {
      console.log("PWA installed");
      installContainer.classList.add("hidden");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
          .then((registration) => console.log("Service worker registered", registration.scope))
          .catch((error) => console.error("Service worker registration failed", error));
      });
    }
  </script>
</body>
</html>
