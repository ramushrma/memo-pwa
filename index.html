<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memo">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>Memo PWA</title>
</head>
<body>
  <h2>Home</h2>
  <p>All assets use relative paths for reliable deployment.</p>
  <ul>
    <li><a href="./notes.html">Notes</a></li>
    <li><a href="./tasks.html">Tasks</a></li>
    <li><a href="./about.html">About</a></li>
  </ul>

  <div id="install-prompt" class="install-prompt hidden" role="dialog" aria-live="polite">
    <span>Install Memo to your home screen</span>
    <button id="install-button" class="install-action">Add to Home screen</button>
    <button id="install-close" class="install-close" aria-label="Close">×</button>
  </div>

  <script>
    let deferredInstallPrompt = null;
    const installPrompt = document.getElementById("install-prompt");
    const installButton = document.getElementById("install-button");
    const installClose = document.getElementById("install-close");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installPrompt.classList.remove("hidden");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choiceResult = await deferredInstallPrompt.userChoice;
      console.log("Install prompt result:", choiceResult.outcome);
      deferredInstallPrompt = null;
      installPrompt.classList.add("hidden");
    });

    installClose.addEventListener("click", () => {
      installPrompt.classList.add("hidden");
    });

    window.addEventListener("appinstalled", () => {
      console.log("PWA installed");
      installPrompt.classList.add("hidden");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
          .then((registration) => console.log("Service worker registered", registration.scope))
          .catch((error) => console.error("Service worker registration failed", error));
      });
    }
  </script>
</body>
</html>
