<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=1">
  
  <!-- CRITICAL: Zpeed's PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Memo">
  <meta name="apple-mobile-web-app-title" content="Memo">
  <meta name="theme-color" content="#2563eb">
  <meta name="msapplication-TileColor" content="#2563eb">
  <meta name="msapplication-TileImage" content="/icon-192.png">
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Icons (absolute paths like Zpeed) -->
  <link rel="icon" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/style.css">
  
  <title>Memo - Notes & Tasks</title>
</head>
<body>
  <header>
    <h1>📝 Memo</h1>
    <p>Your personal notes &amp; tasks</p>
  </header>

  <main>
    <!-- PWA Note (exactly like Zpeed) -->
    <p class="pwa-note">Works offline after you add it.</p>

    <!-- Install Button (exactly like Zpeed) -->
    <div id="installer">
      <button class="button install-button" type="button">Add to Home screen</button>
    </div>

    <div class="card-grid">
      <a href="/notes.html" class="card">
        <div class="card-icon">📋</div>
        <h3>Notes</h3>
        <p>Create and manage your notes</p>
      </a>
      <a href="/tasks.html" class="card">
        <div class="card-icon">✅</div>
        <h3>Tasks</h3>
        <p>Track your daily tasks</p>
      </a>
      <a href="/about.html" class="card">
        <div class="card-icon">ℹ️</div>
        <h3>About</h3>
        <p>Learn more about Memo</p>
      </a>
    </div>
  </main>

  <!-- Service Worker Registration (exactly like Zpeed) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
    }
  </script>
</body>
</html>
