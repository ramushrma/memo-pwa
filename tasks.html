<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="transparent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" sizes="192x192" href="/icon-192.png">
  <title>Memo Spin Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #eef2ff; color: #0f172a; display: flex; justify-content: center; align-items: center; padding: 18px; }
    .page { width: 100%; max-width: 540px; background: white; border-radius: 32px; border: 1px solid rgba(148,163,184,0.18); box-shadow: 0 28px 60px rgba(15,23,42,0.12); overflow: hidden; }
    .hero { background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; padding: 28px 24px; }
    .hero h1 { font-size: 2rem; margin-bottom: 10px; }
    .hero p { opacity: 0.92; line-height: 1.6; }
    .wallet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 20px; }
    .chip { background: #f8fafc; border: 1px solid #dbeafe; border-radius: 24px; padding: 18px; text-align: center; box-shadow: 0 16px 30px rgba(15,23,42,0.08); }
    .chip strong { display: block; font-size: 1.5rem; margin-bottom: 6px; color: #1d4ed8; }
    .chip span { color: #475569; font-size: 0.95rem; }
    .wheel-panel { padding: 0 24px 24px; }
    .wheel-box { position: relative; width: min(360px, 100%); aspect-ratio: 1/1; margin: 0 auto 18px; }
    .pointer { position: absolute; left: 50%; top: -12px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 22px solid #2563eb; transform: translateX(-50%); z-index: 2; }
    .wheel { width: 100%; height: 100%; border-radius: 50%; border: 12px solid #c7d2fe; background: conic-gradient(#e0e7ff 0 45deg, #f8fafc 45deg 90deg, #e0e7ff 90deg 135deg, #f8fafc 135deg 180deg, #e0e7ff 180deg 225deg, #f8fafc 225deg 270deg, #e0e7ff 270deg 315deg, #f8fafc 315deg 360deg); position: relative; transition: transform 3s ease-out; }
    .segment { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; font-weight: 700; color: #1e293b; }
    .segment:nth-child(1) { transform: rotate(0deg) translateY(-42%) rotate(0deg); }
    .segment:nth-child(2) { transform: rotate(45deg) translateY(-42%) rotate(-45deg); }
    .segment:nth-child(3) { transform: rotate(90deg) translateY(-42%) rotate(-90deg); }
    .segment:nth-child(4) { transform: rotate(135deg) translateY(-42%) rotate(-135deg); }
    .segment:nth-child(5) { transform: rotate(180deg) translateY(-42%) rotate(-180deg); }
    .segment:nth-child(6) { transform: rotate(225deg) translateY(-42%) rotate(-225deg); }
    .segment:nth-child(7) { transform: rotate(270deg) translateY(-42%) rotate(-270deg); }
    .segment:nth-child(8) { transform: rotate(315deg) translateY(-42%) rotate(-315deg); }
    .spin-button { width: 100%; padding: 16px; border: none; border-radius: 18px; font-size: 1rem; font-weight: 700; background: #2563eb; color: white; cursor: pointer; box-shadow: 0 16px 30px rgba(37,99,235,0.18); }
    .spin-button:hover { background: #1d4ed8; }
    .result { padding: 0 24px; margin-top: 16px; text-align: center; color: #334155; }
    .home-link { display: block; text-align: center; margin: 22px auto 18px; color: #2563eb; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>Spin Game</h1>
      <p>Play for fun — no real money involved. Won amounts are added to a local demo wallet only.</p>
    </section>
    <div class="wallet" id="walletGrid"></div>
    <div class="wheel-panel">
      <div class="wheel-box">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
          <div class="segment">1</div>
          <div class="segment">3</div>
          <div class="segment">5</div>
          <div class="segment">20</div>
          <div class="segment">50</div>
          <div class="segment">3</div>
          <div class="segment">1</div>
          <div class="segment">5</div>
        </div>
      </div>
      <button id="spinButton" class="spin-button" onclick="startSpin()">Spin Now</button>
      <div class="result" id="resultText">Play for fun — no real money taken. Wait for the wheel to stop.</div>
      <a href="./" class="home-link">Back to Home</a>
    </div>
  </div>
  <script>
    const walletGrid = document.getElementById('walletGrid');
    const wheel = document.getElementById('wheel');
    const spinButton = document.getElementById('spinButton');
    const resultText = document.getElementById('resultText');
    const segments = [1, 3, 5, 20, 50, 3, 1, 5];
    let canSpin = true;
    console.log('tasks script loaded');
    spinButton.addEventListener('click', () => console.log('spinButton clicked (listener)'));
    let wallet = loadWallet();

    function loadWallet() {
      const saved = localStorage.getItem('memoWallet');
      return saved ? JSON.parse(saved) : { '1': 0, '3': 0, '5': 0, '20': 0, '50': 0 };
    }

    function saveWallet() {
      localStorage.setItem('memoWallet', JSON.stringify(wallet));
    }

    function renderWallet() {
      const total = Object.entries(wallet).reduce((sum, [value, count]) => sum + Number(value) * count, 0);
      walletGrid.innerHTML = Object.entries(wallet).map(([value, count]) => `
        <div class="chip">
          <strong>${count}</strong>
          <span>₹${value}</span>
        </div>
      `).join('') + `
        <div class="chip" style="background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; border-color: transparent; grid-column: span 3;">
          <strong>₹${total}</strong>
          <span>Total</span>
        </div>
      `;
    }

    function getSpinResult() {
      const index = Math.floor(Math.random() * segments.length);
      return { value: segments[index], index };
    }

    function startSpin() {
      console.log('startSpin called');
      // safety: ensure handler responds even if called multiple ways
      if (!canSpin) return;
      canSpin = false;
      // provide immediate UI feedback so user knows click registered
      spinButton.textContent = 'Spinning...';
      const { value, index } = getSpinResult();
      const spins = 6;
      const degreesPerSegment = 45;
      const targetRotation = 360 * spins + index * degreesPerSegment + 22.5;

      wheel.style.transition = 'transform 3s cubic-bezier(0.33, 1, 0.68, 1)';
      wheel.style.transform = `rotate(${targetRotation}deg)`;
      resultText.textContent = 'Spinning...';

      setTimeout(() => {
        const finalRotation = targetRotation % 360;
        wheel.style.transition = 'none';
        wheel.style.transform = `rotate(${finalRotation}deg)`;
        wallet[value] += 1;
        saveWallet();
        renderWallet();
        resultText.innerHTML = `Won <strong>₹${value}</strong> — added to local demo wallet (play only).`;
        spinButton.textContent = 'Spin Now';
        console.log('spin finished, value=', value, 'index=', index);
        canSpin = true;
      }, 3200);
    }

    spinButton.addEventListener('click', startSpin);
    renderWallet();
  </script>
</body>
</html>
