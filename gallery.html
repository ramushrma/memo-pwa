<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="transparent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" sizes="192x192" href="/icon-192.png">
  <title>Memo Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .page { width: 100%; max-width: 520px; border-radius: 30px; overflow: hidden; background: white; border: 1px solid rgba(148,163,184,0.18); box-shadow: 0 28px 60px rgba(15,23,42,0.12); }
    .hero { background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; padding: 28px 24px; }
    .hero h1 { font-size: 2.1rem; margin-bottom: 10px; }
    .hero p { opacity: 0.92; line-height: 1.6; }
    .wallet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 22px; }
    .chip { background: #f8fafc; border-radius: 24px; padding: 18px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 18px 36px rgba(15,23,42,0.06); }
    .chip strong { display: block; font-size: 1.5rem; margin-bottom: 8px; color: #1d4ed8; }
    .chip span { color: #64748b; font-size: 0.95rem; }
    .gallery-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 22px; }
    .photo { background: #eef2ff; border-radius: 24px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; color: #1d4ed8; font-size: 1.1rem; font-weight: 700; border: 1px dashed rgba(37,99,235,0.25); }
    .actions { display: grid; gap: 12px; padding: 0 22px 22px; }
    .actions a { display: block; text-align: center; text-decoration: none; color: #2563eb; padding: 14px 0; border-radius: 18px; border: 1px solid #c7d2fe; background: #eff6ff; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>Gallery</h1>
      <p>Local demo wallet totals are shown here for convenience — play-only, no real money involved.</p>
    </section>
    <div class="wallet" id="walletGrid"></div>
    <div class="gallery-grid">
      <div class="photo">Photo 1</div>
      <div class="photo">Photo 2</div>
      <div class="photo">Photo 3</div>
      <div class="photo">Photo 4</div>
    </div>
    <div class="actions">
      <a href="./">Home</a>
      <a href="./tasks.html">Spin</a>
      <a href="./earning.html">Earning</a>
    </div>
  </div>
  <script>
    const walletGrid = document.getElementById('walletGrid');
    function loadWallet() {
      const saved = localStorage.getItem('memoWallet');
      return saved ? JSON.parse(saved) : { '1': 0, '3': 0, '5': 0, '20': 0, '50': 0 };
    }
    function renderWallet() {
      const wallet = loadWallet();
      const total = Object.entries(wallet).reduce((sum, [value, count]) => sum + Number(value) * count, 0);
      walletGrid.innerHTML = Object.entries(wallet).map(([value, count]) => `
        <div class="chip">
          <strong>${count}</strong>
          <span>₹${value}</span>
        </div>
      `).join('') + `
        <div class="chip" style="background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; border-color: transparent; grid-column: span 3;">
          <strong>₹${total}</strong>
          <span>Total</span>
        </div>
      `;
    }
    renderWallet();
  </script>
</body>
</html>
